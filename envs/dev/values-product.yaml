# ===================================================
#                    PRODUCT
# ===================================================

# namespace: ecommerce-dev 

# ---------------------------------------------------
# Container
# ---------------------------------------------------
image:
  ecr_registry: 254405569649.dkr.ecr.us-east-1.amazonaws.com
  ecr_repository: ecommerce-dev/product
  tag: latest
  digest: sha256:a5c6e8120a55cc2f541421a56847c9bfd1bcc485b711234f514c776f6ac8ff34
containerName: product
imagePullPolicy: Always
terminationGracePeriodSeconds: 30
# ---------------------------------------------------
# Labels
# ---------------------------------------------------
labels:
  app.kubernetes.io/name: ecommerce
  app.kubernetes.io/component: product
  app.kubernetes.io/env: dev
  app.kubernetes.io/version: 1.0.0
# ---------------------------------------------------
# Deployment
# ---------------------------------------------------
deployment:
  name: product-deploy
  replicas: 1
# ---------------------------------------------------
# Service
# ---------------------------------------------------
service:
  name: product-svc
  type: ClusterIP
  port: 8001
  targetPort: 8001
# ---------------------------------------------------
# Pod Annotations
# ---------------------------------------------------
annotations:
  enabled: true
  enable_checksum: true
  checksum_file: configmap.yaml
  values:
    reloader.stakater.com/auto: "true"
# ---------------------------------------------------
# Security Context
# ---------------------------------------------------
podSecurityContext:
  enabled: true
  values:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
containerSecurityContext:
  enabled: true
  values:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
# ---------------------------------------------------
# Configmaps & Secrets
# ---------------------------------------------------
configmap:
  enabled: true
  name: product-configmap
  values:
    ENVIRONMENT: "dev"
    AWS_REGION: "us-east-1"
    DYNAMODB_ENDPOINT: "< DYNAMODB_ENDPOINT >"
    PRODUCTS_TABLE: "ecommerce-products"
secret:
  name: shopverse-dev-mysql-jwt-credentials
  create: false # Creates through ESO    
envFrom:
  enabled: true
  values:
    - configMapRef:
        name: product-configmap
    # - secretRef:
    #     name: ecommerce-dev-postgre-jwt-credentials # Creates through ESO   
# ---------------------------------------------------
# Limits & Requests
# ---------------------------------------------------
resources:
  enabled: true
  values:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
# ---------------------------------------------------
# Healthcheck Probes
# ---------------------------------------------------
startupProbe:
  enabled: true
  values:
    httpGet:
      path: /health
      port: 8001
    failureThreshold: 10
    periodSeconds: 10
readinessProbe:
  enabled: true
  values:
    httpGet:
      path: /health
      port: 8001
    initialDelaySeconds: 15
    periodSeconds: 10
livenessProbe:
  enabled: true
  values:
    httpGet:
      path: /health
      port: 8001
    initialDelaySeconds: 20
    periodSeconds: 30
# ---------------------------------------------------
# Autoscaling
# ---------------------------------------------------
autoscaling:
  enabled: false
  values:
    name: product-hpa
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
# ---------------------------------------------------
# Service Account
# ---------------------------------------------------
serviceAccount:
  create: true
  values:
    name: product-sa
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::254405569649:role/ecommerce-dev-product-role"
# ---------------------------------------------------
# Target Group Binding
# ---------------------------------------------------
targetGroupBinding:
  enabled: true
  values:
    name: ecommerce-dev-product-tgb
    targetType: "ip"
    targetGroupName: ecommerce-dev-product-tg
    # targetGroupARN: "REPLACE_WITH_TERRAFORM_OUTPUT"
# ---------------------------------------------------
# Node Selectors
# ---------------------------------------------------
nodeSelector:
  enabled: true
  values:
    workload: application
# ---------------------------------------------------
# Tolerations
# ---------------------------------------------------
tolerations:
  enabled: true
  values:
    - key: dedicated
      operator: Equal
      value: application
      effect: NoSchedule
