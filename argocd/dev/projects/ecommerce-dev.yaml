apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ecommerce-dev
  namespace: argocd

spec:

  # ============================================================
  # Allowed Git repositories
  # ============================================================
  sourceRepos:
    - https://github.com/vaheed-valaxy/tgb-ecommerce-gitops.git

  # ============================================================
  # Allowed destinations
  # ============================================================
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ecommerce-dev

  # ============================================================
  # Cluster-wide resources this AppProject can manage
  # ============================================================
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

    # - group: "rbac.authorization.k8s.io"
    #   kind: Role

    # - group: "rbac.authorization.k8s.io"
    #   kind: RoleBinding

  # ============================================================
  # Namespace-scoped resources this AppProject can manage
  # ============================================================
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # ============================================================
  # AppProject role for GitHub Actions
  # ============================================================
  roles:

    - name: ecommerce-gh-actions-dev
      description: GitHub Actions role for syncing E-commerce DEV applications.
      
      policies:

        # Allow GitHub Actions to read the DEV applications
        - p, proj:ecommerce-dev:ecommerce-gh-actions-dev, applications, get, ecommerce-dev/*, allow 

        # Allow GitHub Actions to sync the DEV applications
        - p, proj:ecommerce-dev:ecommerce-gh-actions-dev, applications, sync, ecommerce-dev/*, allow
          
        # -p, proj:<proj_name>:<role_name>, applications, sync, <proj_name>/*, allow
  # ============================================================
  # Description
  # ============================================================
  description: >
    Single AppProject for dev environment of E-commerce application.
    Provides GitOps permissions and allows automated namespace creation.
