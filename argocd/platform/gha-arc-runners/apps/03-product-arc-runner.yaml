apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-product-arc-runners
  namespace: argocd
spec:
  project: ecommerce-arc-runners   # default

  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: "0.15.0"
      helm:
        releaseName: ecommerce-product-arc-runners
        skipCrds: false
        valueFiles:
          - $values/envs/platform/gha-arc-runners/values-arc-product.yaml

    - repoURL: https://github.com/vaheed-valaxy/tgb-ecommerce-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
