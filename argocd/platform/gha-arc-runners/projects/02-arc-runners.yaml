apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ecommerce-arc-runners
  namespace: argocd

spec:
  description: Ecommerce ARC runner scale sets.

  sourceRepos:
    - ghcr.io/actions/actions-runner-controller-charts
    - https://github.com/vaheed-valaxy/tgb-ecommerce-gitops.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: arc-runners

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
